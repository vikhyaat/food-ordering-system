{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <h3 class="fw-bold mb-3 text-center">Set a New Password</h3>
                {% if validlink %}
                <form method="post">
                    {% csrf_token %}
                    {{ form.new_password1 }}
                    <div class="mt-2"></div>
                    {{ form.new_password2 }}
                    <button type="submit" class="btn btn-danger w-100 mt-3">Change Password</button>
                </form>
                {% else %}
                <p class="text-danger">This password reset link is invalid, possibly because it has already been used.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
