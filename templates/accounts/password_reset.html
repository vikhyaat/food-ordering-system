{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <h3 class="fw-bold mb-3 text-center">Reset Password</h3>
                <p class="text-muted small">Enter your email and we'll send you a link to reset your password.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.email }}
                    <button type="submit" class="btn btn-danger w-100 mt-3">Send Reset Link</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
