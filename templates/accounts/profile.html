{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-3">
            {% include "accounts/_account_sidebar.html" %}
        </div>
        <div class="col-md-9">
            <div class="card p-4">
                <h3 class="fw-bold mb-4">My Profile</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        {% for field in form %}
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
                        </div>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-danger">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
